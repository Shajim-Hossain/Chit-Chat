<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Chat - Enhanced</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #667eea;
      --primary-dark: #5a6fd1;
      --secondary-color: #764ba2;
      --success-color: #4facfe;
      --danger-color: #e74c3c;
      --text-dark: #2c3e50;
      --text-light: #7f8c8d;
      --bg-light: rgba(255, 255, 255, 0.9);
      --border-radius: 16px;
      --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-dark);
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--box-shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .header {
      background: linear-gradient(135deg, #2c3e50, #34495e);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--success-color), #00f2fe);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .header-text h1 {
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    .header-text p {
      opacity: 0.8;
      font-size: 0.9rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      position: relative;
    }

    .online-status {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background: #00ff88;
      border: 2px solid #2c3e50;
      border-radius: 50%;
    }

    .user-email {
      font-size: 0.9rem;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .dropdown-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .dropdown-content {
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: var(--box-shadow);
      min-width: 180px;
      z-index: 1000;
      display: none;
      overflow: hidden;
    }

    .dropdown-content.show {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-content button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
    }

    .dropdown-content button:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .dropdown-content button.danger {
      color: var(--danger-color);
    }

    .content {
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* Auth Forms */
    .auth-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-container {
      background: var(--bg-light);
      padding: 30px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.5rem;
      color: var(--text-dark);
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
    }

    .form-group input {
      width: 100%;
      padding: 14px 14px 14px 45px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-dark), #6a3da8);
      transform: translateY(-2px);
    }

    .toggle-link {
      text-align: center;
      margin-top: 15px;
      color: var(--primary-color);
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }

    .toggle-link:hover {
      color: var(--secondary-color);
    }

    /* Chat Container */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: var(--bg-light);
      padding: 12px 20px;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
      box-shadow: var(--box-shadow);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .stat-item i {
      color: var(--primary-color);
    }

    .messages-container {
      height: 400px;
      overflow-y: auto;
      background: var(--bg-light);
      border-radius: var(--border-radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--box-shadow);
    }

    .messages-container::-webkit-scrollbar {
      width: 8px;
    }

    .messages-container::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: rgba(102, 126, 234, 0.5);
      border-radius: 10px;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 16px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      position: relative;
      max-width: 80%;
    }

    .message.own {
      margin-left: auto;
      background: linear-gradient(135deg, var(--success-color), #00f2fe);
      color: white;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .sender {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .message.own .sender {
      color: white;
    }

    .message-actions {
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: var(--transition);
    }

    .message:hover .message-actions {
      opacity: 1;
    }

    .message-action-btn {
      background: rgba(0, 0, 0, 0.05);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      color: inherit;
    }

    .message-action-btn:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .message-action-btn.delete {
      color: var(--danger-color);
    }

    .message-text {
      line-height: 1.5;
      word-break: break-word;
    }

    .timestamp {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .message-form {
      display: flex;
      gap: 12px;
      background: var(--bg-light);
      padding: 15px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
    }

    .message-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      font-size: 1rem;
      resize: none;
      min-height: 50px;
      max-height: 120px;
    }

    .message-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .send-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--success-color), #00f2fe);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .send-btn:hover {
      transform: translateY(-2px);
    }

    /* Loading and Error States */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-light);
      gap: 10px;
    }

    .loading i {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .error {
      background: rgba(231, 76, 60, 0.1);
      color: var(--danger-color);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    .modal.show {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: white;
      border-radius: var(--border-radius);
      padding: 25px;
      width: 90%;
      max-width: 400px;
      box-shadow: var(--box-shadow);
      transform: translateY(-20px);
      transition: var(--transition);
    }

    .modal.show .modal-content {
      transform: translateY(0);
    }

    .modal h3 {
      margin-bottom: 15px;
      font-size: 1.3rem;
      text-align: center;
    }

    .modal p {
      margin-bottom: 20px;
      text-align: center;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-btn.cancel {
      background: #f0f0f0;
    }

    .modal-btn.confirm {
      background: var(--danger-color);
      color: white;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        border-radius: 12px;
      }
      
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
      
      .header-left {
        flex-direction: column;
      }
      
      .header-text h1 {
        font-size: 1.5rem;
      }
      
      .messages-container {
        height: 300px;
      }
      
      .message {
        max-width: 90%;
      }
      
      .message-form {
        flex-direction: column;
      }
      
      .stats-bar {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <div class="logo">
          <i class="fas fa-comments"></i>
        </div>
        <div class="header-text">
          <h1>Elite Chat</h1>
          <p>Connect, share, and communicate</p>
        </div>
      </div>
      
      <div id="user-info" class="user-info hidden">
        <div class="user-avatar">
          <span id="user-initial">U</span>
          <div class="online-status"></div>
        </div>
        <div class="user-email" id="user-email"></div>
        <div class="dropdown">
          <button class="dropdown-btn" id="dropdown-btn">
            <i class="fas fa-cog"></i>
          </button>
          <div class="dropdown-content" id="dropdown-content">
            <button onclick="logout()">
              <i class="fas fa-sign-out-alt"></i>
              Logout
            </button>
            <button onclick="confirmDeleteAccount()" class="danger">
              <i class="fas fa-trash-alt"></i>
              Delete Account
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <!-- Auth Container -->
      <div id="auth-container" class="auth-container">
        <div id="login-container" class="form-container">
          <h2><i class="fas fa-sign-in-alt"></i> Welcome Back!</h2>
          <form id="login-form">
            <div class="form-group">
              <i class="fas fa-envelope"></i>
              <input type="email" id="login-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
              <i class="fas fa-lock"></i>
              <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-sign-in-alt"></i>
              Login
            </button>
          </form>
          <div class="toggle-link" id="show-signup">
            <i class="fas fa-user-plus"></i>
            Don't have an account? Sign up
          </div>
        </div>

        <div id="signup-container" class="form-container hidden">
          <h2><i class="fas fa-user-plus"></i> Join the Chat!</h2>
          <form id="signup-form">
            <div class="form-group">
              <i class="fas fa-envelope"></i>
              <input type="email" id="signup-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
              <i class="fas fa-lock"></i>
              <input type="password" id="signup-password" placeholder="Create password (min 6 chars)" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-user-plus"></i>
              Create Account
            </button>
          </form>
          <div class="toggle-link" id="show-login">
            <i class="fas fa-sign-in-alt"></i>
            Already have an account? Login
          </div>
        </div>
      </div>

      <!-- Chat Container -->
      <div id="chat-container" class="hidden">
        <div class="stats-bar">
          <div class="stat-item">
            <i class="fas fa-users"></i>
            <span id="user-count">0 Online</span>
          </div>
          <div class="stat-item">
            <i class="fas fa-comments"></i>
            <span id="message-count">0 Messages</span>
          </div>
          <div class="stat-item">
            <i class="fas fa-clock"></i>
            <span id="current-time"></span>
          </div>
        </div>

        <div id="messages" class="messages-container loading">
          <i class="fas fa-spinner"></i>
          <span>Loading messages...</span>
        </div>
        
        <form id="message-form" class="message-form">
          <textarea id="message-input" class="message-input" placeholder="Type your message..." required></textarea>
          <button type="submit" class="send-btn">
            <i class="fas fa-paper-plane"></i>
            Send
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal">
    <div class="modal-content">
      <h3><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h3>
      <p id="delete-message">Are you sure you want to delete this message?</p>
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeDeleteModal()">
          Cancel
        </button>
        <button class="modal-btn confirm" onclick="confirmDelete()">
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCgZDWF7h6cIFx-003Kfdwyw2ZcK_ucH88",
      authDomain: "chit-chat-app-d7029.firebaseapp.com",
      projectId: "chit-chat-app-d7029",
      storageBucket: "chit-chat-app-d7029.firebasestorage.app",
      messagingSenderId: "1067790314425",
      appId: "1:1067790314425:web:ceba7724e06abddebaa468"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // DOM Elements
    const authContainer = document.getElementById('auth-container');
    const chatContainer = document.getElementById('chat-container');
    const loginContainer = document.getElementById('login-container');
    const signupContainer = document.getElementById('signup-container');
    const userInfo = document.getElementById('user-info');
    const userEmail = document.getElementById('user-email');
    const userInitial = document.getElementById('user-initial');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const showSignup = document.getElementById('show-signup');
    const showLogin = document.getElementById('show-login');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const messagesDiv = document.getElementById('messages');
    const deleteModal = document.getElementById('delete-modal');
    const userCountSpan = document.getElementById('user-count');
    const messageCountSpan = document.getElementById('message-count');
    const currentTimeSpan = document.getElementById('current-time');
    const dropdownBtn = document.getElementById('dropdown-btn');
    const dropdownContent = document.getElementById('dropdown-content');

    // App State
    let currentUser = null;
    let messageToDelete = null;
    let messageCount = 0;
    let onlineUsers = 0;

    // Initialize the app
    function init() {
      setupEventListeners();
      updateTime();
      auth.onAuthStateChanged(handleAuthStateChange);
    }

    // Set up event listeners
    function setupEventListeners() {
      // Toggle between login/signup
      showSignup.addEventListener('click', () => {
        loginContainer.classList.add('hidden');
        signupContainer.classList.remove('hidden');
      });

      showLogin.addEventListener('click', () => {
        signupContainer.classList.add('hidden');
 loginContainer.classList.remove('hidden');
      });
      
            // Dropdown toggle
      dropdownBtn.addEventListener('click', toggleDropdown);

      // Close dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.dropdown')) {
          dropdownContent.classList.remove('show');
        }
      });

      // Auth forms
      loginForm.addEventListener('submit', handleLogin);
      signupForm.addEventListener('submit', handleSignup);

      // Message form
      messageForm.addEventListener('submit', sendMessage);

      // Enter key handling for message input
      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          messageForm.dispatchEvent(new Event('submit'));
        }
      });
    }

    // Handle authentication state changes
    function handleAuthStateChange(user) {
      currentUser = user;
      
      if (user) {
        // User is signed in
        authContainer.classList.add('hidden');
        chatContainer.classList.remove('hidden');
        userInfo.classList.remove('hidden');
        
        // Set user info
        userEmail.textContent = user.email;
        userInitial.textContent = user.email.charAt(0).toUpperCase();
        
        // Load messages and update user status
        loadMessages();
        updateOnlineStatus(true);
        
        // Focus message input after a short delay
        setTimeout(() => {
          messageInput.focus();
        }, 300);
      } else {
        // User is signed out
        chatContainer.classList.add('hidden');
        authContainer.classList.remove('hidden');
        userInfo.classList.add('hidden');
        
        // Reset to login form
        signupContainer.classList.add('hidden');
        loginContainer.classList.remove('hidden');
        
        // Update online status
        updateOnlineStatus(false);
      }
    }

    // Update time display
    function updateTime() {
      const now = new Date();
      currentTimeSpan.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      setTimeout(updateTime, 1000);
    }

    // Toggle dropdown menu
    function toggleDropdown(e) {
      e.stopPropagation();
      dropdownContent.classList.toggle('show');
    }

    // Handle login
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      // Set loading state
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
      submitBtn.disabled = true;
      
      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          loginForm.reset();
        })
        .catch(error => {
          console.error("Login error:", error);
          showError("Login failed: " + error.message);
        })
        .finally(() => {
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        });
    }

    // Handle signup
    function handleSignup(e) {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      // Set loading state
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
      submitBtn.disabled = true;
      
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
          signupForm.reset();
          showSuccess("Account created successfully!");
        })
        .catch(error => {
          console.error("Signup error:", error);
          showError("Signup failed: " + error.message);
        })
        .finally(() => {
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        });
    }

    // Logout function
    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        auth.signOut().catch(error => {
          console.error("Logout error:", error);
          showError("Error logging out. Please try again.");
        });
      }
    }

    // Delete account function
    function confirmDeleteAccount() {
      if (confirm('⚠️ WARNING: This will permanently delete your account and all your messages. Are you sure?')) {
        const user = auth.currentUser;
        if (user) {
          // First delete all user messages
          db.collection("messages")
            .where("email", "==", user.email)
            .get()
            .then((querySnapshot) => {
              const batch = db.batch();
              querySnapshot.forEach((doc) => {
                batch.delete(doc.ref);
              });
              return batch.commit();
            })
            .then(() => {
              // Then delete the user account
              return user.delete();
            })
            .then(() => {
              showSuccess("Account and all messages deleted successfully.");
            })
            .catch(error => {
              console.error("Delete account error:", error);
              if (error.code === 'auth/requires-recent-login') {
                showError("For security, please login again before deleting your account.");
              } else {
                showError("Error deleting account: " + error.message);
              }
            });
        }
      }
    }

    // Load messages in real-time
    function loadMessages() {
      messagesDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading messages...</span>';
      
      db.collection("messages")
        .orderBy("timestamp")
        .onSnapshot(snapshot => {
          messagesDiv.innerHTML = "";
          messageCount = 0;
          
          if (snapshot.empty) {
            messagesDiv.innerHTML = `
              <div class="loading">
                <i class="fas fa-comments"></i>
                <span>No messages yet. Start the conversation!</span>
              </div>
            `;
          } else {
            snapshot.forEach(doc => {
              displayMessage(doc.id, doc.data());
              messageCount++;
            });
          }
          
          messageCountSpan.textContent = `${messageCount} Messages`;
          scrollToBottom();
        }, error => {
          console.error("Error loading messages:", error);
          messagesDiv.innerHTML = `
            <div class="error">
              <i class="fas fa-exclamation-triangle"></i>
              <span>Error loading messages. Please refresh the page.</span>
            </div>
          `;
        });
    }

    // Display a message
    function displayMessage(messageId, message) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message');
      
      // Check if message is from current user
      const isOwner = currentUser && message.email === currentUser.email;
      if (isOwner) {
        messageDiv.classList.add('own');
      }
      
      const timestamp = message.timestamp ? 
        new Date(message.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 
        'Just now';
      
      messageDiv.innerHTML = `
        <div class="message-header">
          <span class="sender">${escapeHtml(message.email)}</span>
          <div class="message-actions">
            ${isOwner ? `
            <button class="message-action-btn delete" onclick="showDeleteModal('${messageId}', true)" title="Delete my message">
              <i class="fas fa-trash-alt"></i>
            </button>` : ''}
            <button class="message-action-btn delete" onclick="showDeleteModal('${messageId}', false)" title="Delete for everyone">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
        <div class="message-text">${escapeHtml(message.text)}</div>
        <div class="timestamp">
          <i class="fas fa-clock"></i>
          ${timestamp}
        </div>
      `;
      messagesDiv.appendChild(messageDiv);
    }

    // Send new message
    function sendMessage(e) {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const text = messageInput.value.trim();
      if (text === "") return;

      // Set loading state
      const sendBtn = messageForm.querySelector('button[type="submit"]');
      const originalText = sendBtn.innerHTML;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      sendBtn.disabled = true;

      db.collection("messages").add({
        text: text,
        email: user.email,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        messageInput.value = "";
        scrollToBottom();
      })
      .catch(error => {
        console.error("Message send error:", error);
        showError("Failed to send message: " + error.message);
      })
      .finally(() => {
        sendBtn.innerHTML = originalText;
        sendBtn.disabled = false;
        messageInput.focus();
      });
    }

    // Message deletion functions
    function showDeleteModal(messageId, isOwner) {
      messageToDelete = messageId;
      const deleteMessage = document.getElementById('delete-message');
      
      deleteMessage.textContent = isOwner ? 
        'Are you sure you want to delete your message?' : 
        'Are you sure you want to delete this message for everyone?';
      
      deleteModal.classList.add('show');
    }

    function closeDeleteModal() {
      deleteModal.classList.remove('show');
      messageToDelete = null;
    }

    function confirmDelete() {
      if (messageToDelete) {
        db.collection("messages").doc(messageToDelete).delete()
          .then(() => {
            closeDeleteModal();
          })
          .catch(error => {
            console.error("Error removing message: ", error);
            showError("Error deleting message. Please try again.");
            closeDeleteModal();
          });
      }
    }

    // Track online users (simplified version)
    function updateOnlineStatus(isOnline) {
      // In a real app, you would use Firebase Presence or a more robust solution
      onlineUsers = isOnline ? 1 : 0;
      userCountSpan.textContent = isOnline ? '1 Online' : '0 Online';
    }

    // Helper functions
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showError(message) {
      alert(message); // In a real app, you might show a nicer error message in the UI
    }

    function showSuccess(message) {
      alert(message); // In a real app, you might show a nicer success message in the UI
    }

    // Initialize the app when DOM is loaded
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
